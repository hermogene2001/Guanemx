name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    env:
      # Validation-only URL. The client is never connected to a database here,
      # and no real secrets are involved.
      DATABASE_URL: postgresql://guanemx:secret123@localhost:5432/guanemx_ci?schema=public
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test