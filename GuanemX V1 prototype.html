<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuanemX V1 prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E3E8F0;--bg:#EEF1F6;--panel:#FFFFFF;--panel2:#F3F5F9;--line:#DCE2ED;--text:#0E1526;--muted:#5A6781;
  --brand:#E3B04B;--brand-ink:#1A1405;--brand-text:#8F5E06;--brand-soft:rgba(227,176,75,.22);
  --up:#0B8F62;--down:#D13B4A;--info:#2F6FE4;--up-soft:rgba(11,143,98,.12);--down-soft:rgba(209,59,74,.12);
  --grid:rgba(14,21,38,.08);--frame:#C4CCDC;--tag-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#05080F;--bg:#090D16;--panel:#0F1626;--panel2:#151E32;--line:#22304A;--text:#E8EDF6;--muted:#8B98B2;
    --brand-text:#EBBE62;--brand-soft:rgba(227,176,75,.16);--up:#2ECC8F;--down:#F26D78;--info:#6EA8FE;
    --up-soft:rgba(46,204,143,.14);--down-soft:rgba(242,109,120,.14);--grid:rgba(139,152,178,.11);--frame:#1B2438;--tag-ink:#07110D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#05080F;--bg:#090D16;--panel:#0F1626;--panel2:#151E32;--line:#22304A;--text:#E8EDF6;--muted:#8B98B2;
  --brand-text:#EBBE62;--brand-soft:rgba(227,176,75,.16);--up:#2ECC8F;--down:#F26D78;--info:#6EA8FE;
  --up-soft:rgba(46,204,143,.14);--down-soft:rgba(242,109,120,.14);--grid:rgba(139,152,178,.11);--frame:#1B2438;--tag-ink:#07110D;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--page);color:var(--text);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;letter-spacing:-.015em;line-height:1.15}
h1{font-size:28px;font-weight:700}h2{font-size:22px;font-weight:700}h3{font-size:16px;font-weight:700;margin-bottom:12px}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* page chrome */
.viewer{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px}
.viewer .t{display:flex;align-items:center;gap:10px;font-weight:600}
.viewer .n{color:var(--muted);font-size:13px}
.spacer{flex:1}
.wrap{flex:1;min-height:0;display:flex;justify-content:center;padding:0 16px 16px}
.stage{flex:1;max-width:1360px;min-width:0;position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:18px;container:stage/inline-size}
.stage.phone{flex:none;width:392px;max-width:100%;height:min(100%,860px);align-self:center;border:9px solid var(--frame);border-radius:44px}
#app{height:100%}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center}
@media (max-width:700px){
  .viewer{display:none}
  .wrap{padding:0}
  .stage,.stage.phone{width:100%;max-width:none;height:100%;border:0;border-radius:0;flex:1}
}

/* shared controls */
.btn{height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.brand:hover{filter:brightness(1.06)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.pill.up{background:var(--up-soft);border-color:transparent;color:var(--up)}
.pill.dn{background:var(--down-soft);border-color:transparent;color:var(--down)}
.pill.warn,.pill.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand-text)}
.pill.tier::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.sel,.mini{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;width:100%}
.sel{width:auto;height:38px;padding:0 10px}
.mini{width:110px;height:34px}
.field input::placeholder{color:var(--muted)}
.pw{position:relative}
.pw .icon{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.err{color:var(--down);font-size:13px;min-height:20px;margin:-4px 0 8px}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--up)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--info);outline-offset:2px}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px;margin-top:14px}
.note .i{margin-top:2px;width:16px;height:16px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.sm{color:var(--muted);font-size:13px}

/* auth */
.auth{height:100%;display:grid;grid-template-columns:minmax(360px,470px) minmax(0,1fr)}
.auth-form{padding:36px 44px;overflow:auto;display:flex;flex-direction:column;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.auth-form h1{margin-top:44px}
.auth-form .sub{margin:8px 0 24px;color:var(--muted)}
.row-end{display:flex;justify-content:flex-end;margin:-6px 0 16px;font-size:13px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{text-align:center;margin-top:20px;font-size:14px;color:var(--muted)}
.hint{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
.trio{list-style:none;margin:auto 0 0;padding:28px 0 0;display:grid;gap:14px}
.trio li{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.trio b{display:block;color:var(--text);font-size:14px}
.trio .i{margin-top:2px;color:var(--brand-text)}
.hero{background:#0A0F1A;color:#E8EDF6;display:flex;flex-direction:column;min-height:0;min-width:0}
.hero-chart{flex:1;position:relative;min-height:180px}
.hero-chart canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-copy{padding:8px 48px 44px;max-width:640px}
.hero-px{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;color:#8B98B2;font-size:14px}
.hero-px b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:30px;color:#E8EDF6;font-weight:700;font-variant-numeric:tabular-nums}
.hero h2{font-size:34px;line-height:1.1}
.hero p{margin-top:12px;color:#8B98B2;max-width:46ch}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.side .brand{padding:2px 8px 18px}
.side-h{padding:0 10px 4px;font-size:13px;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:500;text-align:left}
.nav-i:hover{background:var(--panel2);color:var(--text)}
.nav-i[aria-current="page"]{background:var(--panel2);color:var(--text)}
.nav-i[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.bdg{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:99px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 0}
.me b{display:block;font-size:14px;line-height:1.2}
.me span{font-size:12px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.top-l{flex:1;min-width:0}
.top-note{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.top-note .i{width:16px;height:16px}
.top-brand{display:none;align-items:center;gap:8px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700}
.chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.chip span{font-size:11px;color:var(--muted)}
.chip b{font-size:15px}
.content{overflow:auto;padding:26px 28px 40px;min-height:0}
.tabbar{display:none}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph .sub{color:var(--muted);margin-top:6px;max-width:60ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel.nopad{padding:0;overflow:hidden}
.panel h3+.sm{margin-top:-8px;margin-bottom:12px}
.ph-r{display:flex;align-items:center;gap:10px}
.strip{display:grid;grid-template-columns:1.5fr repeat(3,1fr);padding:0;overflow:hidden;margin-bottom:16px}
.strip .cell{padding:18px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;justify-content:center}
.strip .cell:first-child{border-left:0}
.strip .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.strip .mid{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:26px;font-weight:700;letter-spacing:-.01em}
.strip small{color:var(--muted);font-size:12px}
.strip .acts{margin-top:10px}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px;align-items:start}
.chartg{grid-template-columns:minmax(0,1fr) 270px}
.cv{position:relative;height:260px}
.cv.tall{height:clamp(300px,52vh,500px)}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.ctl{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ohlc{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);min-height:46px}
.ohlc b{color:var(--text);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.watch{display:flex;flex-direction:column}
.watch button{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);background:none;padding:10px 4px;text-align:left}
.watch button:first-child{border-top:0}
.watch button[aria-current="true"]{background:var(--panel2);border-radius:8px}
.watch .px{text-align:right;font-variant-numeric:tabular-nums}
.watch .px small{display:block;font-size:12px}

/* rows */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .grow{flex:1;min-width:0}
.lrow .nm{font-weight:600}
.col{min-width:92px;text-align:right}
.col small{display:block;color:var(--muted);font-size:12px}
.bot{display:block;border-radius:12px;flex:none}
.ti{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ti.in{background:var(--up-soft);color:var(--up)}
.ti.out{background:var(--down-soft);color:var(--down)}
.tabs{margin-bottom:14px}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search .i{position:absolute;left:12px;top:11px;color:var(--muted);width:16px;height:16px}
.search input{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 12px 0 36px}

/* robot detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:500;padding:0;margin-bottom:16px}
.rd{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center}
.facts{display:grid;grid-template-columns:repeat(4,auto);gap:8px 32px;justify-content:start;margin:16px 0 18px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:12px;color:var(--muted)}
.facts b{font-size:16px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);margin-top:14px}
.stats4 div{padding:14px 0;display:flex;flex-direction:column}
.stats4 span{font-size:12px;color:var(--muted)}
.stats4 b{font-size:20px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.acc{border-top:1px solid var(--line);padding:12px 0}
.acc:first-of-type{border-top:0}
.acc summary{font-weight:600;cursor:pointer}
.acc p{color:var(--muted);margin-top:8px}
.rev{padding:12px 0;border-top:1px solid var(--line)}
.rev:first-of-type{border-top:0}
.star{color:var(--brand);width:15px;height:15px;fill:currentColor;stroke:none}
.bul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:8px}
.bul b{color:var(--text)}

/* wallet */
.wal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0;overflow:hidden;margin-bottom:16px}
.wal>div{padding:16px 18px;border-left:1px solid var(--line);display:flex;gap:12px;align-items:center}
.wal>div:first-child{border-left:0}
.coin{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:600;background:var(--panel2)}
.opt input:checked+span{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt input:focus-visible+span{outline:2px solid var(--info);outline-offset:2px}
.quick{display:flex;gap:8px;margin:-6px 0 14px}

/* chat */
.chatg{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;height:520px;padding:0}
.chat-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.bub{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.msg.me .bub{background:var(--brand-soft);border-color:transparent}
.bub b{font-size:13px}.bub time{font-size:12px;color:var(--muted);margin-left:8px}
.bub p{margin-top:2px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;min-width:0}
.rail{display:flex;flex-direction:column;gap:16px}
.room{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500;text-align:left}
.room[aria-current="true"]{background:var(--panel2);color:var(--text)}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0}
.mem .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);margin-left:auto}

/* profile */
.pf{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.pf .avatar{width:96px;height:96px;font-size:30px;margin:0 auto 12px}
.dl{margin:0}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.dl div:first-child{border-top:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:500;text-align:right}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}

/* admin */
.bars{display:flex;gap:10px;align-items:flex-end;height:180px;padding-top:24px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:34px;background:var(--info);border-radius:5px 5px 0 0;min-height:4px}
.bar em{font-style:normal;font-size:11px}
.donutw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:none}
.donut .d1{font:700 17px "Bricolage Grotesque",system-ui,sans-serif;fill:var(--text)}
.donut .d2{font-size:8px;fill:var(--muted)}
.leg{display:grid;gap:6px;font-size:13px}
.leg span{display:flex;gap:8px;align-items:center;color:var(--muted)}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tag{display:inline-flex}

/* modal + toast */
.modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(5,8,15,.62)}
.dlg{position:relative;width:min(460px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.dlg h2{margin-bottom:6px}
.dlg .sub{color:var(--muted);margin-bottom:18px;font-size:14px}
.dlg .acts{margin-top:8px;justify-content:flex-end}
.dlg .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.sumrow{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:14px 0}
.chk input{margin-top:3px}
.sheetrow{display:flex;align-items:center;gap:14px;width:100%;height:48px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-weight:500}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast div{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500}

/* narrow layout: follows the app width, so the Phone toggle works on desktop too */
@container stage (max-width:860px){
  .auth{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:auto}
  .hero{order:-1}
  .hero-chart{min-height:150px;flex:none;height:150px}
  .hero-copy{display:none}
  .auth-form{padding:24px 20px;overflow:visible}
  .auth-form h1{margin-top:22px}
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding:6px 4px}
  .tabbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:6px 0}
  .tabbar button[aria-current="page"]{color:var(--text)}
  .tabbar button[aria-current="page"] .i{color:var(--brand-text)}
  .top{padding:10px 16px}
  .top-note{display:none}
  .top-brand{display:flex}
  .content{padding:18px 16px 28px}
  h1{font-size:24px}
  .strip{grid-template-columns:1fr 1fr}
  .strip .cell{border-left:0;border-top:1px solid var(--line);padding:14px 16px}
  .strip .cell:first-child{grid-column:1/-1;border-top:0}
  .strip .cell:nth-child(3),.strip .cell:nth-child(5){border-left:1px solid var(--line)}
  .strip .big{font-size:34px}
  .g2,.chartg,.g3,.chatg,.pf{grid-template-columns:minmax(0,1fr)}
  .xtra{display:none}
  .lrow{gap:10px}
  .rd{grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:start}
  .facts{grid-template-columns:repeat(2,auto)}
  .stats4{grid-template-columns:repeat(2,1fr)}
  .wal{grid-template-columns:1fr}
  .wal>div{border-left:0;border-top:1px solid var(--line)}
  .wal>div:first-child{border-top:0}
  .chat{height:460px}
  .rail .panel:last-child{display:none}
  .modal{place-items:end center;padding:0}
  .dlg{width:100%;border-radius:18px 18px 0 0;border-bottom:0}

  .hero-px{margin:0}

}

  const volH=bare?0:ph*.12,priceH=ph-volH-(bare?0:6);
  let mn=Infinity,mx=-Infinity;for(const k of d){if(k.l<mn)mn=k.l;if(k.h>mx)mx=k.h}
  const pad=(mx-mn)*.1||P.vol;mn-=pad;mx+=pad;
  const step=pw/d.length,bw=Math.max(2,Math.min(14,step*.62));
  const X=i=>pl+step*(i+.5),Y=v=>pt+priceH*(1-(v-mn)/(mx-mn));
  x.font=FONT;x.lineWidth=1;
  for(let i=0;i<=(bare?4:5);i++){
    const v=mn+(mx-mn)*i/(bare?4:5),y=Y(v);
    x.strokeStyle=C.grid;x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();
    if(!bare){x.fillStyle=C.muted;x.textAlign='left';x.textBaseline='middle';x.fillText(v.toFixed(P.dec),W-pr+8,y)}
  }
  if(!bare){
    const nt=narrow?4:6;x.textBaseline='top';
    for(let k=0;k<nt;k++){
      const i=Math.round((d.length-1)*k/(nt-1));
      x.strokeStyle=C.grid;x.beginPath();x.moveTo(X(i),pt);x.lineTo(X(i),pt+priceH);x.stroke();
      x.fillStyle=C.muted;x.textAlign=k===0?'left':(k===nt-1?'right':'center');
      x.fillText(tl(d[i].t,sec),X(i)+(k===0?-bw/2:k===nt-1?bw/2:0),H-pb+7);
    }
    d.forEach((k,i)=>{x.fillStyle=k.c>=k.o?C.up:C.down;x.globalAlpha=.28;const vh=volH*k.v;x.fillRect(X(i)-bw/2,pt+ph-vh,bw,vh);x.globalAlpha=1});
  }
  d.forEach((k,i)=>{
    const col=k.c>=k.o?C.up:C.down;x.strokeStyle=col;x.fillStyle=col;
    x.beginPath();x.moveTo(X(i),Y(k.h));x.lineTo(X(i),Y(k.l));x.stroke();
    const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));x.fillRect(X(i)-bw/2,y1,bw,Math.max(1.5,y2-y1));
  });
  const L=d[d.length-1],up=L.c>=L.o,ly=Y(L.c);
  if(!bare){
    x.setLineDash([3,4]);x.strokeStyle=up?C.up:C.down;x.beginPath();x.moveTo(pl,ly);x.lineTo(W-pr,ly);x.stroke();x.setLineDash([]);
    x.fillStyle=up?C.up:C.down;rr(x,W-pr+2,ly-9,pr-4,18,4);x.fill();
    x.fillStyle=C.tag;x.textAlign='left';x.textBaseline='middle';x.fillText(L.c.toFixed(P.dec),W-pr+7,ly+.5);
    if(cv._h!=null){
      const hi=Math.max(0,Math.min(d.length-1,Math.floor((cv._h-pl)/step)));market.hov=d[hi];
      x.setLineDash([3,3]);x.strokeStyle=C.muted;x.beginPath();x.moveTo(X(hi),pt);x.lineTo(X(hi),pt+priceH);x.moveTo(pl,Y(d[hi].c));x.lineTo(W-pr,Y(d[hi].c));x.stroke();x.setLineDash([]);
    }else market.hov=null;
  }
}
function drawLine(cv,o){
  const c=setup(cv);if(!c)return;const {x,W,H}=c,C=colors();
  const pl=o.pl||46,pr=10,pt=12,pb=24,pw=W-pl-pr,ph=H-pt-pb,ys=o.pts;
  let mn=Math.min(...ys),mx=Math.max(...ys);if(o.zero!==false)mn=Math.min(mn,0);
  mx+=(mx-mn)*.08;const rg=(mx-mn)||1;
  const X=i=>pl+pw*i/(ys.length-1),Y=v=>pt+ph*(1-(v-mn)/rg);
  x.font=FONT;x.lineWidth=1;
  for(let i=0;i<=4;i++){const v=mn+rg*i/4,y=Y(v);x.strokeStyle=C.grid;x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.fillStyle=C.muted;x.textAlign='right';x.textBaseline='middle';x.fillText(o.fy(v),pl-8,y)}
  const lb=o.labels,n=Math.min(5,lb.length);x.textBaseline='top';
  for(let k=0;k<n;k++){const i=Math.round((lb.length-1)*k/(n-1||1));x.fillStyle=C.muted;x.textAlign=k===0?'left':(k===n-1?'right':'center');x.fillText(lb[i],X(i),H-pb+7)}
  x.beginPath();ys.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.strokeStyle=o.color||C.up;x.lineWidth=2;x.lineJoin='round';x.stroke();
  x.lineTo(X(ys.length-1),Y(mn));x.lineTo(X(0),Y(mn));x.closePath();x.fillStyle=o.color||C.up;x.globalAlpha=.12;x.fill();x.globalAlpha=1;
  if(cv._h!=null){
    const i=Math.max(0,Math.min(ys.length-1,Math.round((cv._h-pl)/pw*(ys.length-1))));
    x.strokeStyle=C.muted;x.lineWidth=1;x.setLineDash([3,3]);x.beginPath();x.moveTo(X(i),pt);x.lineTo(X(i),pt+ph);x.stroke();x.setLineDash([]);
    x.fillStyle=o.color||C.up;x.beginPath();x.arc(X(i),Y(ys[i]),4,0,7);x.fill();
    const t=lb[i]+'   '+o.fy(ys[i],true),tw=x.measureText(t).width+16,tx=Math.min(Math.max(X(i)-tw/2,pl),W-pr-tw);
    x.fillStyle=C.text;rr(x,tx,pt+2,tw,24,6);x.fill();x.fillStyle=C.panel;x.textAlign='left';x.textBaseline='middle';x.fillText(t,tx+8,pt+14);
  }
}
function perfSeries(seed,n,end){const r=rng(seed);let v=0;const a=[0];for(let i=1;i<n;i++){v+=(r()-.42)+.35;a.push(v)}const k=end/(a[n-1]||1);return a.map(y=>y*k)}
const dayLabels=n=>Array.from({length:n},(_,i)=>{const d=addDays(TODAY,i-(n-1));return d.getDate()+' '+MON[d.getMonth()]});

/* ---------- render ---------- */
function renderApp(keepScroll){
  const old=$('#content'),st=old?old.scrollTop:0,app=$('#app');
  if(S.view==='login'){app.innerHTML=vLogin()}
  else{app.innerHTML=`<div class="shell">${vSide()}<div class="main">${vTop()}<main class="content" id="content" tabindex="-1">${VIEWS[S.view]()}</main></div>${vTabs()}</div>`;
    const c=$('#content');if(keepScroll)c.scrollTop=st}
  app.querySelectorAll('canvas[data-c]').forEach(cv=>{cv._h=null;hookHover(cv);drawOne(cv)});
  updateLive();
  const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
}
function go(v,id){
  if(v==='robot'&&id){S.robotId=id;S.robotTab='Performance'}
  S.view=v;closeModal();renderApp();
}
function toast(msg){
  const t=$('#toast'),d=document.createElement('div');d.textContent=msg;t.appendChild(d);
  setTimeout(()=>d.remove(),3200);
}
function openModal(html){
  const m=$('#modal');m.innerHTML=`<div class="scrim" data-a="close"></div><div class="dlg" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Close">${ic('plus').replace('<svg class="i "','<svg class="i " style="transform:rotate(45deg)"')}</button>${html}</div>`;
  m.hidden=false;const f=m.querySelector('input:not([type=checkbox]):not([type=radio]),button.btn');if(f)setTimeout(()=>f.focus(),30);
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function effTheme(){return S.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.theme}
function setTheme(m){
  S.theme=m;if(m==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m);
  $('#theme-btn').innerHTML=ic(effTheme()==='dark'?'sun':'moon');redrawAll();
}
function setDev(d){
  S.dev=d;$('#stage').classList.toggle('phone',d==='phone');
  document.querySelectorAll('[data-a="dev"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.d===d)));
  setTimeout(redrawAll,30);
}

  'confirm-sub':el=>{
    const r=R(el.dataset.id);if(S.wallets.usd<r.price)return;
    S.wallets.usd=round(S.wallets.usd-r.price);S.spent=round(S.spent+r.price);
    const ex=S.mine.find(m=>m.rid===r.id&&isActive(m));
    if(ex)ex.expires=addDays(ex.expires,r.days);else S.mine.unshift({uid:uid(),rid:r.id,start:TODAY,expires:addDays(TODAY,r.days),profit:0,pct:0});
    S.tx.unshift({type:'Subscription',method:r.name,amt:-r.price,status:'Completed',date:nowStr()});
    S.mtab='active';toast('Subscribed to '+r.name+'.');go('mine');
  },
  mtab:el=>{S.mtab=el.dataset.t;renderApp(true)},
  xtab:el=>{S.xtab=el.dataset.t;renderApp(true)},
  wtab:el=>{S.wtab=el.dataset.t;renderApp(true)},
  deposit:()=>depositModal(),
  withdraw:()=>withdrawModal(),
  amt:el=>{const i=$('#dam');if(i)i.value=el.dataset.v},
  room:el=>{S.room=el.dataset.r;renderApp(true)},
  avatar:()=>toast('Avatar upload is part of the V1 build.'),
  suspend:el=>{const u=S.users.find(x=>x.e===el.dataset.e);u.st=u.st==='Active'?'Suspended':'Active';toast(u.n+' is now '+u.st.toLowerCase()+'.');renderApp(true)},
  approve:el=>{
    const q=S.queue.find(x=>x.id===el.dataset.id);q.status='Approved';
    if(q.tx)q.tx.status='Completed';toast('Withdrawal approved.');renderApp(true);
  },
  reject:el=>{
    const q=S.queue.find(x=>x.id===el.dataset.id);q.status='Rejected';
    if(q.tx){q.tx.status='Rejected';S.wallets.usd=round(S.wallets.usd+q.amt)}
    toast('Withdrawal rejected and refunded.');renderApp(true);
  }
};
const I={
  rsearch:el=>{S.q=el.value;$('#robot-list').innerHTML=robotRows()},
  usearch:el=>{S.uq=el.value;$('#urows').innerHTML=uRows()},
  pair:el=>{market.pair=el.value;market.hov=null;renderApp(true)},
  dper:el=>{S.dper=el.value;renderApp(true)},
  agree:el=>{$('#pay').disabled=!el.checked},
  twofa:el=>{S.user.twofa=el.checked;toast(el.checked?'Two-factor authentication is on.':'Two-factor authentication is off. Your account is less protected.')},
  notif:el=>{S.notif[el.dataset.k]=el.checked},
  price:el=>{const v=parseFloat(el.value),r=R(el.dataset.id);if(!(v>0)){el.value=r.price;toast('Enter a price above $0.');return}r.price=round(v);toast(r.name+' is now '+fmt$(r.price)+' in the marketplace.')},
  listed:el=>{const r=R(el.dataset.id);r.listed=el.checked;toast(r.name+(r.listed?' is listed in the marketplace.':' is hidden from the marketplace.'))}
};
const FM={
  login:f=>{
    const id=f.elements.lid.value.trim(),pw=f.elements.lpw.value,err=$('#auth-err'),reg=S.authMode==='register';
    if(reg&&!f.elements.fname.value.trim()){err.textContent='Enter your full name.';return}
    if(!id){err.textContent='Enter your email or phone number.';return}
    if(pw.length<6){err.textContent='Password must be at least 6 characters.';return}
    if(reg){const n=f.elements.fname.value.trim();S.user.name=n;S.user.first=n.split(/\s+/)[0];if(id.includes('@'))S.user.email=id;S.user.since=fd(TODAY)}
    S.view='dashboard';renderApp();toast(reg?'Account created. Welcome to GuanemX.':'Welcome back, '+S.user.first+'.');
  },
  forgot:f=>{if(!f.elements.fe.value.includes('@')){toast('Enter a valid email address.');return}closeModal();toast('If that email has an account, a reset link is on its way.')},
  deposit:f=>{
    const amt=round(parseFloat(f.elements.amt.value)),m=f.elements.m.value,err=$('#m-err');
    if(!(amt>=10)){err.textContent='The minimum deposit is $10.00.';return}
    const t={type:'Deposit',method:m,amt,status:'Pending',date:nowStr()};S.tx.unshift(t);closeModal();
    toast('Deposit submitted. Waiting for confirmation.');renderApp(true);
    setTimeout(()=>{t.status='Completed';S.wallets.usd=round(S.wallets.usd+amt);toast('Deposit of '+fmt$(amt)+' confirmed.');if(S.view!=='login')renderApp(true)},2600);
  },
  withdraw:f=>{
    const amt=round(parseFloat(f.elements.amt.value)),m=f.elements.m.value,dest=f.elements.dest.value.trim(),err=$('#m-err');
    if(dest.length<6){err.textContent='Enter a valid destination address or account.';return}
    if(!(amt>=10)){err.textContent='The minimum withdrawal is $10.00.';return}
    if(amt>S.wallets.usd){err.textContent='That is more than your USD wallet balance.';return}
    S.wallets.usd=round(S.wallets.usd-amt);
    const t={type:'Withdrawal',method:m,amt:-amt,status:'Pending review',date:nowStr()};S.tx.unshift(t);
    S.queue.unshift({id:uid(),user:S.user.name,amt,method:m,date:t.date,status:'Pending',tx:t});
    closeModal();toast('Withdrawal sent for review.');renderApp(true);
  },
  chat:f=>{
    const i=f.elements[0],v=i.value.trim();if(!v)return;
    const n=new Date(),t=p2(n.getHours())+':'+p2(n.getMinutes()),room=S.room;
    S.msgs[room].push({u:'You',t,m:v});renderApp(true);$('#chat-in').focus();
    if(room==='support')setTimeout(()=>{const d=new Date();S.msgs.support.push({u:'GuanemX Support',t:p2(d.getHours())+':'+p2(d.getMinutes()),m:'Thanks for your message. An agent will reply here shortly.'});if(S.view==='chat'&&S.room==='support')renderApp(true)},1500);
  },
  pw:f=>{
    const e=$('#pw-err'),a=f.elements.pw0.value,b=f.elements.pw1.value,c=f.elements.pw2.value;
    if(!a){e.textContent='Enter your current password.';return}
    if(b.length<8){e.textContent='Use at least 8 characters for the new password.';return}
    if(b!==c){e.textContent='The new passwords do not match.';return}
    e.textContent='';f.reset();toast('Password updated.');
  }
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el,e)});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{
  const el=e.target.closest('[data-i]');if(!el||!I[el.dataset.i])return;
  if((el.dataset.ev||'change')!==e.type)return;I[el.dataset.i](el,e);
}));
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f&&FM[f.dataset.form]){e.preventDefault();FM[f.dataset.form](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
if('ResizeObserver' in window)new ResizeObserver(()=>redrawAll()).observe($('#stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{$('#theme-btn').innerHTML=ic(effTheme()==='dark'?'sun':'moon');redrawAll()});
setInterval(()=>{tick();document.querySelectorAll('#app canvas[data-c="hero"],#app canvas[data-c="main"]').forEach(drawOne);updateLive()},1000);

/* ---------- boot ---------- */
$('#v-brand').innerHTML=logo(28)+'<span>GuanemX</span>';
const db=document.querySelectorAll('[data-a="dev"]');
db[0].innerHTML=ic('monitor')+'Desktop';db[1].innerHTML=ic('phone')+'Phone';
$('#theme-btn').innerHTML=ic(effTheme()==='dark'?'sun':'moon');
renderApp();
})();
</script>
</body>
</html>
